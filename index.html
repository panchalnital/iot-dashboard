<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IoT Fleet Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
  body { background:#eee; font-family:"Inter",system-ui,sans-serif; color:#444; }
  .panel { background:#fff; border-radius:6px; padding:16px 20px; height:100%; }
  .panel h5 { font-size:1.15rem; font-weight:500; padding-bottom:10px; border-bottom:1px solid #eee; margin-bottom:12px; }
  .panel h5 i { margin-right:8px; }
  .chart-box { position:relative; height:300px; }
  .tl-row { display:flex; border-top:1px solid #ddd; height:90px; }
  .tl-label { width:260px; flex:none; padding:12px 16px; }
  .tl-label a { color:#d9780f; font-weight:500; text-decoration:none; }
  .tl-label small { display:block; margin-top:6px; font-size:.82rem; }
  .tl-track { position:relative; flex:1; background:repeating-linear-gradient(90deg,#f3f3f3 0,#f3f3f3 1px,transparent 1px,transparent 12.5%); }
  .tl-seg { position:absolute; top:22px; height:34px; border:1px solid rgba(0,0,0,.2); }
  .tl-hours { position:relative; height:30px; margin-left:260px; }
  .tl-hours span { position:absolute; transform:translateX(-50%); font-size:.9rem; }
  .dot { display:inline-block; width:14px; height:14px; border-radius:2px; margin-right:4px; vertical-align:middle; }
  .badge-change { background:#4caf78; color:#fff; padding:4px 10px; border-radius:4px; font-size:.85rem; }
</style>
</head>
<body>
<div id="root" class="container-fluid p-3"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;
const C = { orange:'#ef9234', green:'#049143', dark:'#cc6d1e', maroon:'#9b1b24', teal:'#00b5a8', olive:'#a89a3c', grey:'#e6eff0' };

/* Generic Chart.js wrapper */
function Chart2({ type, data, options }) {
  const ref = useRef(null);
  useEffect(() => {
    const chart = new Chart(ref.current, { type, data, options: { responsive:true, maintainAspectRatio:false, ...options } });
    return () => chart.destroy();
  }, [data]);
  return <div className="chart-box"><canvas ref={ref} /></div>;
}

const Panel = ({ icon, title, extra, children }) => (
  <div className="panel">
    <div className="d-flex justify-content-between align-items-start">
      <h5 className="flex-grow-1"><i className={'bi ' + icon}></i>{title}</h5>
      {extra}
    </div>
    {children}
  </div>
);

const grid = { grid:{ color:'#eee', borderDash:[6,6] } };

function Distance({ d }) {
  const data = { labels:d.labels, datasets:[
    { label:'Current Period', data:d.current,  borderColor:C.dark, backgroundColor:'rgba(204,109,30,.4)', fill:true, tension:.4, pointBackgroundColor:C.dark },
    { label:'Previous Period', data:d.previous, borderColor:'rgba(204,109,30,.35)', borderDash:[5,5], backgroundColor:'rgba(204,109,30,.06)', fill:true, tension:.4, pointStyle:'rectRot' },
  ]};
  return <Panel icon="bi-geo-alt" title={`Traveled distance (${d.total}km)`}
          extra={<span className="badge-change">+ {d.change}%</span>}>
    <Chart2 type="line" data={data} options={{ plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:c => `${c.dataset.label}: ${c.parsed.y} Km` } } }, scales:{ y:{ beginAtZero:true, ...grid } } }} />
  </Panel>;
}

function EngineHours({ d }) {
  const data = { labels:d.labels, datasets:[
    { label:'Ignition', data:d.ignition, backgroundColor:C.green },
    { label:'Idling',   data:d.idling,   backgroundColor:C.orange },
  ]};
  return <Panel icon="bi-gear-wide-connected" title="Engine hours">
    <Chart2 type="bar" data={data} options={{ plugins:{legend:{display:false}}, scales:{ x:{stacked:true, grid:{display:false}}, y:{stacked:true, ...grid} } }} />
  </Panel>;
}

function Activity({ d }) {
  const colors = [C.maroon, C.green, C.orange];
  const data = { labels:d.labels, datasets:[{ data:d.values, backgroundColor:colors, borderWidth:2 }] };
  return <Panel icon="bi-car-front-fill" title="Activity breakdown (Hours)">
    <div className="d-flex align-items-center justify-content-around" style={{minHeight:300}}>
      <div style={{position:'relative', width:260, height:260}}>
        <Chart2 type="doughnut" data={data} options={{ cutout:'60%', plugins:{legend:{display:false}} }} />
        <div className="position-absolute top-50 start-50 translate-middle text-center">
          <div style={{fontSize:'2rem'}}>{d.total.toLocaleString()}</div><small>Hours</small>
        </div>
      </div>
      <div>{d.labels.map((l,i) => <div key={l} className="mb-2"><span className="dot rounded-circle" style={{background:colors[i]}}></span>{l}</div>)}</div>
    </div>
  </Panel>;
}

function Messages({ d }) {
  const data = { labels:d.labels, datasets:[{ data:d.values, backgroundColor:C.dark }] };
  return <Panel icon="bi-chat-dots-fill" title="Messages received">
    <Chart2 type="bar" data={data} options={{ plugins:{legend:{display:false}}, scales:{ x:{grid:{display:false}}, y:{beginAtZero:true, ...grid} } }} />
  </Panel>;
}

function DayOverview({ rows }) {
  const START = 10.5, END = 18, span = END - START;
  const pct = h => ((h - START) / span * 100) + '%';
  const color = { idle:'#d9780f', moving:C.teal, alert:C.olive };
  const stat = { off:[C.grey,'off'], idle:[ '#f57c00','idle'], moving:[C.teal,'moving'], alert:[C.olive,'alert'] };
  return <div className="panel mt-3">
    <div className="d-flex justify-content-between"><h5 className="flex-grow-1"><i className="bi bi-calendar3"></i>Day overview</h5>
      <button className="btn btn-light btn-sm align-self-start" disabled><i className="bi bi-funnel-fill"></i></button></div>
    <div className="tl-hours">{[11,12,13,14,15,16,17,18].map(h => <span key={h} style={{left:pct(h)}}>{h}:00</span>)}</div>
    {rows.map(r => (
      <div className="tl-row" key={r.id}>
        <div className="tl-label">
          <i className="bi bi-truck-front-fill text-warning me-2"></i><a href="#">{r.id}</a>
          <small>{Object.entries(r.stats).map(([k,v]) => <span key={k} className="me-2"><span className="dot" style={{background:stat[k][0]}}></span>{v}%</span>)}</small>
        </div>
        <div className="tl-track">
          {r.segments.map((s,i) => <div key={i} className="tl-seg" title={`${s[2]}`}
              style={{ left:pct(s[0]), width:`calc(${pct(s[1])} - ${pct(s[0])})`, background:color[s[2]] }} />)}
        </div>
      </div>))}
  </div>;
}

function App() {
  const [data, setData] = useState(null);
  const [err, setErr] = useState(null);
  useEffect(() => {
    // jQuery AJAX call to the PHP backend
    $.getJSON('api/dashboard.php').done(setData).fail(() => setErr('Could not load data from api/dashboard.php'));
  }, []);
  if (err)   return <div className="alert alert-danger">{err}</div>;
  if (!data) return <div className="text-center p-5"><div className="spinner-border"></div></div>;
  return <>
    <div className="row g-3">
      <div className="col-lg-6"><Distance d={data.distance} /></div>
      <div className="col-lg-6"><EngineHours d={data.engineHours} /></div>
      <div className="col-lg-6"><Activity d={data.activity} /></div>
      <div className="col-lg-6"><Messages d={data.messages} /></div>
    </div>
    <DayOverview rows={data.dayOverview} />
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
